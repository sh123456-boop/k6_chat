spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # 개발 중에는 create / create-drop / update 중 선택
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true # 스프링 부트 기동 시 Flyway 자동 실행. (사실 기본값이 true라서 보통 생략해도 됩니다.)
    locations: classpath:db/migration # 마이그레이션 스크립트(예: V1__init.sql, V2__add_table.sql, R__refresh_views.sql)를 찾을 경로.
    validate-on-migrate: true # migrate 전에 검증(validate) 수행.
    clean-disabled: true # flyway clean(스키마의 모든 객체 드롭)을 금지. 운영/스테이징은 무조건 true 권장.

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017}
      database: ${MONGO_DB:chat_flux}
    redis:
      host: ${REDIS_HOST}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:chat-broadcast-${CHAT_INSTANCE_ID:local-8081}}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    org.hibernate.SQL: debug

server:
  port: 8081

llm:
  gemini:
    key: ${LLM_KEY}
